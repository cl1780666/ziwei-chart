<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>弦上星河</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #211e1b; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .poster { position: relative; width: min(100vw, 430px); min-height: 100svh; margin: auto; overflow: hidden; background: #e8dac9; }
    .bg { position: absolute; inset: -3%; background-position: center; background-size: cover; animation: drift 14s ease-in-out infinite alternate; }
    .bg-base { background-image: url("../miniprogram/assets/wannan-violin-poster.jpg"); }
    .bg-incoming { opacity: 0; transition: opacity 1.8s ease; }
    .bg-incoming.visible { opacity: 1; }
    .wash { position: absolute; z-index: 1; inset: 0; background: linear-gradient(180deg, rgba(255,248,238,.72), rgba(255,246,234,.12) 42%, transparent 55%, rgba(30,28,25,.38) 73%, rgba(30,26,23,.76)); }
    @keyframes drift { from { transform: scale(1.02) translate(-.4%, 0); } to { transform: scale(1.07) translate(.8%, -.6%); } }
    .copy { position: absolute; z-index: 1; top: 28px; left: 24px; right: 24px; color: #483b36; }
    .meta { display: flex; padding-bottom: 10px; border-bottom: 1px solid rgba(74,69,61,.28); color: #585a52; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 20px 0 0; font-family: "Songti SC", "STSong", serif; font-size: 34px; letter-spacing: 4px; }
    .sub { margin: 7px 0 0; color: #74675e; font-family: "Songti SC", serif; font-size: 14px; letter-spacing: 4px; }
    .sheet { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); padding: 14px 15px 11px; border: 1px solid rgba(255,248,238,.6); border-radius: 7px; background: rgba(247,239,228,.89); box-shadow: 0 14px 40px rgba(24,20,18,.28); }
    .sheet-head { display: flex; justify-content: space-between; color: #7e3036; font-family: "Songti SC", serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .place { color: #7b786f; font-family: sans-serif; font-size: 9px; letter-spacing: 1.5px; }
    .quote { display: -webkit-box; height: 42px; margin: 7px 0 8px; overflow: hidden; color: #474943; font-family: "Songti SC", serif; font-size: 15px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; transition: opacity .22s ease, transform .22s ease; }
    .quote.hiding { opacity: 0; transform: translateY(4px); }
    .start { width: 100%; height: 44px; border: 0; border-radius: 5px; color: #fffaf1; background: linear-gradient(135deg, #7f2f36, #54252a); font-size: 15px; font-weight: 700; letter-spacing: 4px; box-shadow: 0 8px 18px rgba(92,42,43,.22); }
    .hint { display: flex; justify-content: space-between; margin-top: 8px; padding: 7px 0; border-bottom: 1px solid rgba(72,75,68,.15); color: #676b63; font-size: 11px; }
    .signature { display: flex; justify-content: space-between; margin-top: 8px; color: #989085; font-size: 9px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main class="poster">
    <div class="bg bg-base"></div>
    <div class="bg bg-incoming"></div>
    <div class="wash"></div>
    <section class="copy">
      <div class="meta"><span>皖南 · 弦上星河</span></div>
      <h1>欢迎蕾蕾大王</h1>
      <p class="sub">山水入弦，星辰有信</p>
    </section>
    <section class="sheet">
      <div class="sheet-head"><span>蕾言蕾语</span><span class="place">WANNAN · ANHUI</span></div>
      <p class="quote">“喜欢一个人是藏不住的，喜欢两个人一定要藏住。”</p>
      <button class="start">开始测一测</button>
      <div class="hint"><span>资料已保存</span><span>今日余 5 问</span></div>
      <div class="signature"><span>白墙黛瓦 · 一弦一星河</span></div>
    </section>
  </main>
  <script>
    const backgrounds = [
      '../miniprogram/assets/wannan-violin-poster.jpg',
      '../miniprogram/assets/wannan-spring-tea.jpg',
      '../miniprogram/assets/wannan-courtyard.jpg',
      '../miniprogram/assets/wannan-summer-lotus.jpg',
      '../miniprogram/assets/wannan-autumn-tree.jpg',
      '../miniprogram/assets/wannan-winter-window.jpg',
      '../miniprogram/assets/violin-rain-window.jpg',
      '../miniprogram/assets/wannan-moon-violinist.jpg',
      '../miniprogram/assets/wannan-night.jpg'
    ]
    const base = document.querySelector('.bg-base')
    const incoming = document.querySelector('.bg-incoming')
    const quote = document.querySelector('.quote')
    let quotes = [
      '喜欢一个人是藏不住的，喜欢两个人一定要藏住',
      '别问姐爱谁，姐连明天穿什么都没决定',
      '心动归心动，排队还是要排队',
      '姐的钱自己赚，男朋友随缘',
      '漂亮姐姐不排队，只换一家店',
      '系统提示：姐的耐心余额不足',
      '疑似准备认真，实际系统随机推荐'
    ]
    fetch('../miniprogram/utils/quotes-data.json')
      .then(response => response.json())
      .then(loaded => {
        if (Array.isArray(loaded) && loaded.length === 500) quotes = loaded
      })
      .catch(() => {})
    let current = 0
    let quoteIndex = 0
    setInterval(() => {
      const next = (current + 1) % backgrounds.length
      incoming.style.backgroundImage = `url("${backgrounds[next]}")`
      incoming.classList.add('visible')
      setTimeout(() => {
        base.style.backgroundImage = `url("${backgrounds[next]}")`
        incoming.classList.remove('visible')
        current = next
      }, 1800)
    }, 6500)
    setInterval(() => {
      quote.classList.add('hiding')
      setTimeout(() => {
        let nextIndex = quoteIndex
        while (nextIndex === quoteIndex && quotes.length > 1) {
          nextIndex = Math.floor(Math.random() * quotes.length)
        }
        quoteIndex = nextIndex
        quote.textContent = `“${quotes[quoteIndex]}。”`
        quote.classList.remove('hiding')
      }, 220)
    }, 7000)
  </script>
</body>
</html>
