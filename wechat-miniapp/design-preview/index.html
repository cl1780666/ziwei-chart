<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>弦上星河 · 0819</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #211e1b; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .poster { position: relative; width: min(100vw, 430px); min-height: 100svh; margin: auto; overflow: hidden; background: #e8dac9 url("../miniprogram/assets/wannan-violin-poster.jpg") center/cover no-repeat; }
    .poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,248,238,.12), transparent 42%, rgba(30,28,25,.38) 73%, rgba(30,26,23,.76)); }
    .copy { position: absolute; z-index: 1; top: 28px; left: 24px; right: 24px; color: #483b36; }
    .meta { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(74,69,61,.28); color: #585a52; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 20px 0 0; font-family: "Songti SC", "STSong", serif; font-size: 34px; letter-spacing: 4px; }
    .sub { margin: 7px 0 0; color: #74675e; font-family: "Songti SC", serif; font-size: 14px; letter-spacing: 4px; }
    .seal { display: grid; place-items: center; width: 44px; height: 44px; margin-top: 16px; border: 2px solid #812e34; color: #812e34; font-family: serif; font-size: 11px; font-weight: 700; transform: rotate(-4deg); }
    .sheet { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); padding: 18px 18px 15px; border: 1px solid rgba(255,248,238,.6); border-radius: 7px; background: rgba(247,239,228,.94); box-shadow: 0 14px 40px rgba(24,20,18,.28); }
    .sheet-head { display: flex; justify-content: space-between; color: #7e3036; font-family: "Songti SC", serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .place { color: #7b786f; font-family: sans-serif; font-size: 9px; letter-spacing: 1.5px; }
    .quote { min-height: 50px; margin: 10px 0 14px; color: #474943; font-family: "Songti SC", serif; font-size: 17px; line-height: 1.6; }
    .start { width: 100%; height: 52px; border: 0; border-radius: 5px; color: #fffaf1; background: linear-gradient(135deg, #7f2f36, #54252a); font-size: 16px; font-weight: 700; letter-spacing: 4px; box-shadow: 0 8px 18px rgba(92,42,43,.22); }
    .hint { display: flex; justify-content: space-between; margin-top: 12px; padding: 9px 0; border-bottom: 1px solid rgba(72,75,68,.15); color: #676b63; font-size: 11px; }
    .signature { display: flex; justify-content: space-between; margin-top: 13px; color: #989085; font-size: 9px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main class="poster">
    <section class="copy">
      <div class="meta"><span>皖南 · 弦上星河</span><span>FOR LEI 0819</span></div>
      <h1>欢迎蕾蕾大王</h1>
      <p class="sub">山水入弦，星辰有信</p>
      <div class="seal">0819</div>
    </section>
    <section class="sheet">
      <div class="sheet-head"><span>今日一签</span><span class="place">WANNAN · ANHUI</span></div>
      <p class="quote">“皖南的路会拐弯，姐的心情也会。”</p>
      <button class="start">开始测一测</button>
      <div class="hint"><span>2002年8月19日 · 女</span><span>今日余 5 问</span></div>
      <div class="signature"><span>白墙黛瓦 · 一弦一星河</span><span>蕾 · 八一九</span></div>
    </section>
  </main>
</body>
</html>
